[package]
name = "rustamanga-mangalib-parser"
version = "0.13.0"
edition = "2024"
authors = ["Filipponik"]
description = "Mangalib scrapper"
license = "MIT"
readme = "README.md"
repository = "https://github.com/Filipponik/mangalib-parser"
keywords = ["axum-rs", "server", "web-server", "mangalib"]
categories = ["web-programming", "web-programming::http-server", "command-line-interface", "api-bindings"]

[features]
default = ["http_client"]
http_client = []

[profile.release]
strip = true
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"

[dependencies]
reqwest = { version = "0.13.4", features = ["json", "default-tls"], default-features = false }
tokio = { version = "1.53.1", features = ["full"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
dotenvy = "0.15.7"
futures = "0.3.34"
axum = "0.8.9"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
clap = "4.6.6"
lapin = "4.10.0"
thiserror = "2.0.20"
async-stream = "0.3.6"
governor = "0.10.4"
dashmap = "6.2.1"
rand = "0.10.2"
chrono = "0.4.45"
utoipa = { version = "5.5.0", features = ["axum_extras"] }

[dev-dependencies]
mockito = "1.7.2"

[lints.clippy]
pedantic = "warn"
nursery = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
missing_panics_doc = "warn"
panic_in_result_fn = "warn"
cargo_common_metadata = "warn"
