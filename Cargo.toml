[package]
name = "rustamanga-mangalib-parser"
version = "0.10.1"
edition = "2024"
authors = ["Filipponik"]
description = "Mangalib scrapper"
license = "MIT"
readme = "README.md"
repository = "https://github.com/Filipponik/mangalib-parser"
keywords = ["axum-rs", "server", "web-server", "mangalib"]
categories = ["web-programming", "web-programming::http-server", "command-line-interface", "api-bindings"]

[features]
default = ["http_client"]
http_client = []

[profile.release]
strip = true
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"

[dependencies]
reqwest = { version = "0.12.5", features = ["json", "rustls-tls"], default-features = false }
tokio = { version = "1.32.0", features = ["full"] }
serde = { version = "1.0.204", features = ["derive"] }
serde_json = "1.0"
dotenvy = "0.15.0"
futures = "0.3.30"
axum = "0.8.1"
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "json"] }
clap = "4.5.21"
lapin = "3.4.0"
thiserror = "2.0.8"
async-stream = "0.3.6"
governor = "0.10.0"
dashmap = "6.1.0"
rand = "0.9.2"
chrono = "0.4.31"

[dev-dependencies]
mockito = "1.7.0"

[lints.clippy]
pedantic = "warn"
nursery = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
missing_panics_doc = "warn"
panic_in_result_fn = "warn"
cargo_common_metadata = "warn"
