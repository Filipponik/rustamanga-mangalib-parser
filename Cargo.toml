[package]
name = "rustamanga-mangalib-parser"
version = "0.12.0"
edition = "2024"
authors = ["Filipponik"]
description = "Mangalib scrapper"
license = "MIT"
readme = "README.md"
repository = "https://github.com/Filipponik/mangalib-parser"
keywords = ["axum-rs", "server", "web-server", "mangalib"]
categories = ["web-programming", "web-programming::http-server", "command-line-interface", "api-bindings"]

[features]
default = ["http_client"]
http_client = []

[profile.release]
strip = true
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"

[dependencies]
reqwest = { version = "0.13.2", features = ["json", "default-tls"], default-features = false }
tokio = { version = "1.50.0", features = ["full"] }
serde = { version = "1.0.204", features = ["derive"] }
serde_json = "1.0"
dotenvy = "0.15.7"
futures = "0.3.30"
axum = "0.8.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "json"] }
clap = "4.6.0"
lapin = "4.4.0"
thiserror = "2.0.18"
async-stream = "0.3.6"
governor = "0.10.4"
dashmap = "6.1.0"
rand = "0.10.0"
chrono = "0.4.44"

# Fix RUSTSEC-2026-0044 and RUSTSEC-2026-0048
aws-lc-rs = "1.16.2"

# Fix RUSTSEC-2026-0049
rustls-webpki = "0.103.12"

[dev-dependencies]
mockito = "1.7.2"

[lints.clippy]
pedantic = "warn"
nursery = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
missing_panics_doc = "warn"
panic_in_result_fn = "warn"
cargo_common_metadata = "warn"

[package.metadata.cargo-machete]
ignored = ["aws-lc-rs", "rustls-webpki"]
