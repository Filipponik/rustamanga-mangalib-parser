name: Check

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install cargo tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-chef,cargo-audit,cargo-nextest,cargo-machete,cargo-tarpaulin

      - name: Audit
        run: cargo audit

      - name: Unused dependency check
        run: cargo machete

      - name: Static analysis
        run: >
          cargo clippy --all-targets --all-features --
          -W clippy::pedantic
          -W clippy::nursery
          -W clippy::unwrap_used
          -W clippy::panic
          -W clippy::missing_panics_doc
          -W clippy::panic_in_result_fn
          -W clippy::cargo_common_metadata

      # Prepare dependency recipe for cargo-chef
      - name: Cargo chef prepare
        run: cargo chef prepare --recipe recipe.json

      # Cache compiled dependencies keyed by the recipe
      - name: Cache cargo chef
        uses: actions/cache@v4
        with:
          path: |
            target/chef
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-chef-${{ hashFiles('**/recipe.json') }}

      # Build dependency layer once; subsequent steps reuse it
      - name: Cargo chef cook
        run: cargo chef cook --recipe recipe.json --all-features --all-targets --tests --profile dev

      - name: Test
        run: cargo nextest run

      - name: Coverage check
        run: cargo tarpaulin --fail-under 80
